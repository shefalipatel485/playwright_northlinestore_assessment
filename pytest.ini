[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --output=test-results

markers =
    smoke: Critical smoke tests for core store functionality
    e2e: End-to-end browser UI tests
    api: API contract, CRUD, schema, and network mocking tests
    regression: Full regression test suite
    responsive: Desktop and mobile viewport layout tests
